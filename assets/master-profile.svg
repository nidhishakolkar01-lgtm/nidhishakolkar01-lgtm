    </g>

    <!-- System 3: DeepVani -->
    <g transform="translate(0, 186)">
      <rect x="0" y="0" width="375" height="135" rx="10" fill="url(#tile-bg)" stroke="url(#tile-border)" stroke-width="1.3" />
      <text x="18" y="28" class="gold-sans" font-size="18" font-weight="800" fill="#fef08a">DeepVani</text>
      <text x="18" y="54" class="gold-sans" font-size="13.5" font-weight="500" fill="#f0e6c8">
