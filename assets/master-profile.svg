        <text x="180" y="15" text-anchor="middle" class="gold-mono" font-size="11" font-weight="700" fill="#fde047">Edge-TTS</text>

        <rect x="226" y="0" width="65" height="22" rx="4" fill="#241b0b" stroke="#d4af37" stroke-width="1" stroke-opacity="0.6" />
        <text x="258" y="15" text-anchor="middle" class="gold-mono" font-size="11" font-weight="700" fill="#fde047">PyTorch</text>
