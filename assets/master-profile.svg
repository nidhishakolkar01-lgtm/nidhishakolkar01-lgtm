        <text x="34" y="15" text-anchor="middle" class="gold-mono" font-size="11" font-weight="700" fill="#fde047">OpenCV</text>

        <rect x="76" y="0" width="68" height="22" rx="4" fill="#241b0b" stroke="#d4af37" stroke-width="1" stroke-opacity="0.6" />
        <text x="110" y="15" text-anchor="middle" class="gold-mono" font-size="11" font-weight="700" fill="#fde047">YOLOv8</text>

        <rect x="152" y="0" width="68" height="22" rx="4" fill="#241b0b" stroke="#d4af37" stroke-width="1" stroke-opacity="0.6" />
        <text x="186" y="15" text-anchor="middle" class="gold-mono" font-size="11" font-weight="700" fill="#fde047">Whisper</text>

        <rect x="228" y="0" width="46" height="22" rx="4" fill="#241b0b" stroke="#d4af37" stroke-width="1" stroke-opacity="0.6" />
        <text x="251" y="15" text-anchor="middle" class="gold-mono" font-size="11" font-weight="700" fill="#fde047">C++</text>
