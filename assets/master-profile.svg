        <text x="92" y="15" text-anchor="middle" class="gold-mono" font-size="11" font-weight="700" fill="#fde047">Cloud Run</text>

        <rect x="138" y="0" width="58" height="22" rx="4" fill="#241b0b" stroke="#d4af37" stroke-width="1" stroke-opacity="0.6" />
        <text x="167" y="15" text-anchor="middle" class="gold-mono" font-size="11" font-weight="700" fill="#fde047">Docker</text>

