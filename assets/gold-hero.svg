<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="850" height="300" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gold-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080705" />
      <stop offset="35%" stop-color="#120e08" />
      <stop offset="70%" stop-color="#16120a" />
      <stop offset="100%" stop-color="#090805" />
    </linearGradient>

    <!-- Metallic Gold Perimeter Border -->
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#fde047" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#92400e" stop-opacity="0.85" />
    </linearGradient>

    <!-- Gold Heading Gradient -->
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <!-- Tile Surface Gradient -->
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a140b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#110e08" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="tile-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.35" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="ambient-top" cx="15%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambient-bottom" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .gold-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .gold-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="848" height="298" rx="14" fill="url(#gold-bg)" stroke="url(#gold-border)" stroke-width="2" />
  <rect x="1" y="1" width="848" height="298" rx="14" fill="url(#ambient-top)" />
  <rect x="1" y="1" width="848" height="298" rx="14" fill="url(#ambient-bottom)" />

  <!-- ================= SECTION 1: HEADER & LEADERSHIP ================= -->
  <g transform="translate(36, 32)">
    <!-- Status Chip -->
    <rect x="0" y="0" width="310" height="24" rx="12" fill="#1b1509" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="12" cy="12" r="4" fill="#fde047" filter="url(#gold-glow)" />
    <text x="24" y="16" class="gold-mono" font-size="10.5" font-weight="700" fill="#fef08a" letter-spacing="1.1">AI &amp; ML ADVANCED RESEARCH LAB</text>

    <!-- Monogram Seal -->
    <g transform="translate(738, 48)">
      <circle cx="0" cy="0" r="42" fill="#140f07" stroke="url(#gold-border)" stroke-width="1.8" />
      <circle cx="0" cy="0" r="36" stroke="#d4af37" stroke-dasharray="3 3" stroke-width="1" stroke-opacity="0.5" />
      <text x="0" y="10" text-anchor="middle" class="gold-sans" font-size="24" font-weight="900" fill="url(#gold-text)" letter-spacing="2">NA</text>
      <text x="0" y="24" text-anchor="middle" class="gold-mono" font-size="7.5" font-weight="700" fill="#d4af37" letter-spacing="1">RESEARCH</text>
    </g>

    <!-- Large Bold Name -->
    <text x="0" y="62" class="gold-sans" font-size="38" font-weight="900" fill="url(#gold-text)" letter-spacing="0.5">
      NIDHISH AKOLKAR
    </text>
    <text x="0" y="88" class="gold-sans" font-size="15" font-weight="700" fill="#fde047" letter-spacing="0.8">
      FOUNDING LEAD &amp; PRESIDENT <tspan fill="#85641b">|</tspan> AI SYSTEMS ENGINEER
    </text>
    <text x="0" y="109" class="gold-mono" font-size="12" font-weight="500" fill="#c9b98b">
      Autonomous Multi-Agent Runtimes // Tactical Edge CV // Distributed Systems
    </text>
  </g>

  <!-- ================= SECTION 2: 4 LARGE GOLD METRIC TILES ================= -->
  <g transform="translate(36, 172)">
    <!-- Tile 1: Total Contributions -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="185" height="94" rx="10" fill="url(#tile-bg)" stroke="url(#tile-border)" stroke-width="1.4" />
      <text x="16" y="24" class="gold-mono" font-size="10.5" font-weight="700" fill="#c9b98b" letter-spacing="0.8">CONTRIBUTIONS</text>
      <text x="16" y="58" class="gold-mono" font-size="28" font-weight="900" fill="#fef08a">5,290</text>
      <text x="16" y="80" class="gold-sans" font-size="11" font-weight="600" fill="#d4af37">2026: 3,101 <tspan fill="#785e1d">|</tspan> 2025: 2,189</text>
    </g>

    <!-- Tile 2: Active Cadence -->
    <g transform="translate(198, 0)">
      <rect x="0" y="0" width="185" height="94" rx="10" fill="url(#tile-bg)" stroke="url(#tile-border)" stroke-width="1.4" />
      <text x="16" y="24" class="gold-mono" font-size="10.5" font-weight="700" fill="#c9b98b" letter-spacing="0.8">ACTIVE CADENCE</text>
      <text x="16" y="58" class="gold-mono" font-size="28" font-weight="900" fill="#fde047">662 <tspan font-size="16" font-weight="700">DAYS</tspan></text>
      <text x="16" y="80" class="gold-sans" font-size="11.5" font-weight="600" fill="#d4af37">100% Unbroken Streak</text>
    </g>

    <!-- Tile 3: Hackathons -->
    <g transform="translate(396, 0)">
      <rect x="0" y="0" width="185" height="94" rx="10" fill="url(#tile-bg)" stroke="url(#tile-border)" stroke-width="1.4" />
      <text x="16" y="24" class="gold-mono" font-size="10.5" font-weight="700" fill="#c9b98b" letter-spacing="0.8">NATIONAL HONORS</text>
      <text x="16" y="58" class="gold-mono" font-size="26" font-weight="900" fill="#fef08a">3x WINNER</text>
      <text x="16" y="80" class="gold-sans" font-size="11.5" font-weight="600" fill="#d4af37">National Hackathons</text>
    </g>

    <!-- Tile 4: NASA OSDR -->
    <g transform="translate(594, 0)">
      <rect x="0" y="0" width="184" height="94" rx="10" fill="url(#tile-bg)" stroke="url(#tile-border)" stroke-width="1.4" />
      <text x="16" y="24" class="gold-mono" font-size="10.5" font-weight="700" fill="#c9b98b" letter-spacing="0.8">RESEARCH GROUP</text>
      <text x="16" y="58" class="gold-mono" font-size="22" font-weight="900" fill="#fef08a">NASA OSDR</text>
      <text x="16" y="80" class="gold-sans" font-size="11.5" font-weight="600" fill="#d4af37">AWG Working Member</text>
    </g>
  </g>
</svg>