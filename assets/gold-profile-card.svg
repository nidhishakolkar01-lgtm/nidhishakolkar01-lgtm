<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="850" height="300" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gold-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080705" />
      <stop offset="40%" stop-color="#110e08" />
      <stop offset="70%" stop-color="#16120a" />
      <stop offset="100%" stop-color="#0a0805" />
    </linearGradient>

    <!-- Metallic Gold Border Gradient -->
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.7" />
      <stop offset="75%" stop-color="#fde047" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#92400e" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Gold Gradient -->
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <!-- Ambient Gold Glow -->
    <radialGradient id="gold-flare-left" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="gold-flare-right" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card Tile Gradient -->
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a150b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#120e07" stop-opacity="0.95" />
    </linearGradient>

    <!-- Tile Border -->
    <linearGradient id="tile-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .gold-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .gold-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect x="1" y="1" width="848" height="298" rx="14" fill="url(#gold-bg)" stroke="url(#gold-border)" stroke-width="1.8" />

  <!-- Ambient Lighting -->
  <rect x="1" y="1" width="848" height="298" rx="14" fill="url(#gold-flare-left)" />
  <rect x="1" y="1" width="848" height="298" rx="14" fill="url(#gold-flare-right)" />

  <!-- Geometric Circuit Accents -->
  <path d="M 40 1 L 70 30 L 220 30" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1" fill="none" />
  <circle cx="220" cy="30" r="2.5" fill="#d4af37" fill-opacity="0.6" />

  <path d="M 810 299 L 780 270 L 630 270" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1" fill="none" />
  <circle cx="630" cy="270" r="2.5" fill="#d4af37" fill-opacity="0.6" />

  <!-- ================= HEADER SECTION ================= -->
  <!-- Top Badge -->
  <g transform="translate(42, 38)">
    <rect x="0" y="0" width="280" height="22" rx="11" fill="#1b1509" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="12" cy="11" r="3.5" fill="#fde047" filter="url(#gold-glow)" />
    <text x="24" y="15" class="gold-mono" font-size="9.5" font-weight="700" fill="#fef08a" letter-spacing="1.2">AI &amp; ML ADVANCED RESEARCH LAB</text>
  </g>

  <!-- Main Name -->
  <text x="42" y="100" class="gold-sans" font-size="38" font-weight="900" fill="url(#gold-text)" letter-spacing="0.5">
    NIDHISH AKOLKAR
  </text>

  <!-- Title & Scope -->
  <text x="44" y="126" class="gold-sans" font-size="13.5" font-weight="600" fill="#e5c07b" letter-spacing="0.8">
    FOUNDING LEAD &amp; PRESIDENT <tspan fill="#785e1d">|</tspan> AI SYSTEMS ENGINEER
  </text>
  <text x="44" y="146" class="gold-mono" font-size="11" font-weight="500" fill="#a89260">
    Autonomous Multi-Agent Runtimes // Tactical Edge CV // Distributed Orchestration
  </text>

  <!-- Right Side Monogram / Seal -->
  <g transform="translate(740, 90)">
    <circle cx="0" cy="0" r="45" fill="#16120a" stroke="url(#gold-border)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="39" stroke="#d4af37" stroke-dasharray="3 3" stroke-width="1" stroke-opacity="0.4" />
    <!-- NA Monogram -->
    <text x="0" y="10" text-anchor="middle" class="gold-sans" font-size="24" font-weight="900" fill="url(#gold-text)" letter-spacing="2">NA</text>
    <text x="0" y="24" text-anchor="middle" class="gold-mono" font-size="7" font-weight="700" fill="#d4af37" letter-spacing="1">RESEARCH</text>
  </g>

  <!-- Divider -->
  <line x1="42" y1="168" x2="808" y2="168" stroke="url(#gold-border)" stroke-width="1" stroke-opacity="0.3" />

  <!-- ================= 4 GOLD METRIC TILES ================= -->
  <!-- Tile 1: Total Contributions -->
  <g transform="translate(42, 185)">
    <rect x="0" y="0" width="176" height="85" rx="10" fill="url(#tile-bg)" stroke="url(#tile-border)" stroke-width="1.2" />
    <text x="16" y="24" class="gold-mono" font-size="9" font-weight="700" fill="#a89260" letter-spacing="1">TOTAL CONTRIBUTIONS</text>
    <text x="16" y="55" class="gold-mono" font-size="24" font-weight="900" fill="#fef08a">5,266</text>
    <text x="16" y="72" class="gold-sans" font-size="9.5" font-weight="500" fill="#d4af37">2026: 3,077 <tspan fill="#785e1d">|</tspan> 2025: 2,189</text>
  </g>

  <!-- Tile 2: Active Streak -->
  <g transform="translate(234, 185)">
    <rect x="0" y="0" width="176" height="85" rx="10" fill="url(#tile-bg)" stroke="url(#tile-border)" stroke-width="1.2" />
    <text x="16" y="24" class="gold-mono" font-size="9" font-weight="700" fill="#a89260" letter-spacing="1">UNBROKEN CADENCE</text>
    <text x="16" y="55" class="gold-mono" font-size="24" font-weight="900" fill="#fde047">660 <tspan font-size="14" font-weight="700">DAYS</tspan></text>
    <text x="16" y="72" class="gold-sans" font-size="9.5" font-weight="500" fill="#d4af37">100% Daily Active Uptime</text>
  </g>

  <!-- Tile 3: Hackathon Winner -->
  <g transform="translate(426, 185)">
    <rect x="0" y="0" width="176" height="85" rx="10" fill="url(#tile-bg)" stroke="url(#tile-border)" stroke-width="1.2" />
    <text x="16" y="24" class="gold-mono" font-size="9" font-weight="700" fill="#a89260" letter-spacing="1">NATIONAL HONORS</text>
    <text x="16" y="55" class="gold-mono" font-size="22" font-weight="900" fill="#fef08a">3x WINNER</text>
    <text x="16" y="72" class="gold-sans" font-size="9.5" font-weight="500" fill="#d4af37">Defense &amp; Assistive AI</text>
  </g>

  <!-- Tile 4: NASA OSDR -->
  <g transform="translate(618, 185)">
    <rect x="0" y="0" width="190" height="85" rx="10" fill="url(#tile-bg)" stroke="url(#tile-border)" stroke-width="1.2" />
    <text x="16" y="24" class="gold-mono" font-size="9" font-weight="700" fill="#a89260" letter-spacing="1">SCIENTIFIC RESEARCH</text>
    <text x="16" y="55" class="gold-mono" font-size="19" font-weight="900" fill="#fef08a">NASA OSDR</text>
    <text x="16" y="72" class="gold-sans" font-size="9.5" font-weight="500" fill="#d4af37">AWG Working Group Member</text>
  </g>
</svg>